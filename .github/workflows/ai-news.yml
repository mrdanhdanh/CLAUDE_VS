# YUNIE — AI News Daily Auto-Update
# Tự động chạy fetch.mjs mỗi ngày 02:00 UTC và commit ai-news.json
# + cho phép bấm "Run workflow" thủ công trên GitHub (không cần VS Code)
name: AI News — Daily Auto Update

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC mỗi ngày (09:00 VN)
  workflow_dispatch:
    inputs:
      topic:
        description: "Chủ đề cần fetch (vd: AI, AI agents, LLM)"
        required: false
        default: "AI"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch AI news (Last30Days bridge)
        run: |
          TOPIC="${{ inputs.topic || 'AI' }}"
          echo "Fetching topic: $TOPIC"
          node www/ai-news/fetch.mjs --topic "$TOPIC"
          echo "--- ai-news.json head ---"
          head -n 30 www/ai-news/ai-news.json || true
          echo "--- validate JSON ---"
          node -e "JSON.parse(require('fs').readFileSync('www/ai-news/ai-news.json','utf8')); console.log('✅ JSON valid')"

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name "YUNIE Bot"
          git config user.email "yunie@harness.local"
          if git diff --quiet -- www/ai-news/ai-news.json; then
            echo "No changes — skip commit"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git add www/ai-news/ai-news.json
          git commit -m "chore(ai-news): auto-update $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "✅ Pushed"

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload www artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

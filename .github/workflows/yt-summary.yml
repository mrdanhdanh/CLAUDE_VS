# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
# YT Summary — Build transcript + bảng tóm tắt + bản dịch vi (no AI key)
#
# Lanes (đo thật 2026-09-12 — .agent/plans/yt-summary/verify/):
#   • yt-dlp (pip) — best-effort; GitHub IP có thể bị YouTube chặn
#   • + secret YT_COOKIES (cookies.txt export) → chạy chắc cho video công khai
#   • + builtin scrape lane trong build.mjs (last-ditch)
# Khi mọi lane fail → comment hướng dẫn chạy local (không giả vờ thành công).
#
# Cách dùng:
#   • Issue: tạo issue có link YouTube + label `yt-summary` → bot build → comment kết quả
#   • Actions → "YT Summary — Build" → Run workflow → dán URL (nhanh nhất)
name: YT Summary — Build

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link YouTube (hoặc video id)"
        required: true
        type: string
      force:
        description: "Build lại kể cả khi đã có dữ liệu"
        required: false
        type: boolean
        default: false
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: yt-summary-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue && contains(github.event.issue.labels.*.name, 'yt-summary'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python + yt-dlp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yt-dlp

      - name: Resolve URL + video id
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            URL="$INPUT_URL"
          else
            URL=$(printf '%s' "${{ github.event.issue.body }}" | grep -oE 'https?://(www\.)?(youtube\.com/(watch\?[^ \t\r\n)]+|shorts/[^ \t\r\n)]+|live/[^ \t\r\n)]+)|youtu\.be/[^ \t\r\n)]+)' | head -n1 || true)
          fi
          if [ -z "${URL:-}" ]; then
            echo "::error::Không tìm thấy link YouTube trong issue/workflow input"
            exit 1
          fi
          VIDEOID=$(printf '%s' "$URL" | grep -oE '(v=|youtu\.be/|shorts/|live/)[A-Za-z0-9_-]{6,20}' | head -n1 | sed -E 's/^(v=|youtu\.be\/|shorts\/|live\/)//' || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "id=$VIDEOID" >> "$GITHUB_OUTPUT"
          echo "Link: $URL · Video: $VIDEOID"

      - name: Optional cookies (secret YT_COOKIES = nội dung cookies.txt)
        id: cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "Lane cookies: BẬT (secret YT_COOKIES)"
          else
            echo "Lane cookies: tắt (không có secret YT_COOKIES) — best-effort thôi"
          fi

      - name: Build (transcript → clean → summary → dịch vi)
        env:
          URL: ${{ steps.resolve.outputs.url }}
          COOKIE_FILE: ${{ runner.temp }}/yt-cookies.txt
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=(--url "$URL")
          if [ -f "$COOKIE_FILE" ]; then ARGS+=(--cookies "$COOKIE_FILE"); fi
          if [ "$FORCE" = "true" ] || [ "$FORCE" = "True" ]; then ARGS+=(--force); fi
          node scripts/yt-summary/build.mjs "${ARGS[@]}"

      - name: Commit if changed (pages.yml tự deploy theo push www/**)
        id: commit
        run: |
          set -euo pipefail
          git config user.name "YUNIE Bot"
          git config user.email "yunie@harness.local"
          if git diff --quiet -- www/yt-summary/data; then
            echo "No changes — skip commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add www/yt-summary/data
          git commit -m "chore(yt-summary): build ${{ steps.resolve.outputs.id }} ($(date -u +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment kết quả vào issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.commit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }} # placeholder — steps build chưa id; xem logic bên dưới
          VIDEOID: ${{ steps.resolve.outputs.id }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          if [[ "$REPO_NAME" == *.github.io ]]; then BASE="https://$REPO_NAME"; else BASE="https://$OWNER.github.io/$REPO_NAME"; fi
          if [ -f "www/yt-summary/data/$VIDEOID.json" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "✅ **Đã build xong** \`$VIDEOID\`

          🎬 Xem trên trang: $BASE/yt-summary/#$VIDEOID
          📄 Dữ liệu: \`www/yt-summary/data/$VIDEOID.json\` (Pages sẽ deploy theo push www/**)

          *(Bảng tóm tắt + transcript sạch + bản dịch vi — extractive, không dùng AI key.)*"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "❌ **Không lấy được phụ đề** cho \`$VIDEOID\` — YouTube chặn IP datacenter (đã đo thật, xem \`.agent/plans/yt-summary/verify/\`). Video này KHÔNG được ghi dữ liệu rác.

          **3 cách chạy chắc (chọn 1):**
          1. **Local + cookies browser**: \`node scripts/yt-summary/build.mjs --url \"<link>\" --cookies-from-browser edge\` — *đóng browser trước* khi chạy, rồi \`git push\`.
          2. **cookies.txt**: cài extension *Get cookies.txt LOCALLY* → xuất → \`--cookies cookies.txt\` (local), hoặc lưu nội dung làm secret \`YT_COOKIES\` để CI chạy chắc.
          3. **File phụ đề**: tải .vtt/.srt (extension) → *dán vào trang YT Summary trên site* (mục 2, chạy ngay trong browser) hoặc \`--vtt file.vtt --id $VIDEOID\`."
          fi

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
# YUNIE — Deploy www/ to GitHub Pages
# Copy file mới vào www/ là tự deploy. Không cần sửa workflow khi thêm trang.
name: Deploy www to Pages

on:
  push:
    branches: [main, master]
    paths:
      - "www/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  eval:
    name: Offline eval gate (P1-2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run eval gate (www/library)
        run: node .github/harness/scripts/eval-gate.mjs --scope www/library

  deploy:
    needs: eval
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload www artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

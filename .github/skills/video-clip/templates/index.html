<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLIP TITLE — storyboard</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background:#070a12; color:#f5f7fb; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#070a12; }
  .stage { width:min(100vw, 562.5px); aspect-ratio:9/16; position:relative; overflow:hidden; background:#070a12; }
  canvas { display:block; width:100%; height:100%; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
  <main class="stage" aria-label="Kịch bản clip">
    <canvas id="canvas" width="1080" height="1920" role="img" aria-label="Mô tả nội dung clip cho screen reader"></canvas>
    <h1 class="sr">Tiêu đề clip</h1>
  </main>
<script>
(() => {
  const canvas = document.querySelector('#canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ── TOKENS ────────────────────────────────────────────────────────────────
  // Một object DUY NHẤT. Thiếu key ở đây = ctx.fillStyle = undefined = KHÔNG throw,
  // chữ giữ màu cũ ⇒ tàng hình. verify-frames.mjs quét đúng chỗ này.
  const C = {
    bg: '#070a12', panel: '#101827', panel2: '#162235', ink: '#f5f7fb',
    muted: '#a9b6ca', mint: '#c8f6f9', green: '#55e6a5', orange: '#ff9b54',
    pink: '#ef6bba', blue: '#7aa2ff', yellow: '#ffcc66', line: '#293850', white: '#ffffff'
  };

  // ── BEATS ─────────────────────────────────────────────────────────────────
  // `at`/`end` phải khớp `segments` trong voiceover-segments.json (guard timing so 2 bên).
  const DURATION = 50;
  const beats = [
    { at: 0,  end: 5,  eyebrow: 'HOOK',     title: 'Tiêu đề\nmở đầu.',  sub: 'dòng phụ ngắn' },
    { at: 5,  end: 14, eyebrow: '01 · FACT',   title: 'Dữ kiện\nchính.', sub: 'nguồn / bối cảnh' },
    { at: 14, end: 28, eyebrow: '02 · DETAIL', title: 'Chi tiết\ndài nhất.', sub: 'beat chiếm nhiều thời gian nhất' },
    { at: 28, end: 39, eyebrow: '03 · CAVEAT', title: 'Phần chưa\nchắc chắn.', sub: 'nói rõ giới hạn để giữ uy tín', size: 84 },
    { at: 39, end: 50, eyebrow: 'CTA',      title: 'Câu hỏi\ncho bạn?',  sub: 'một lựa chọn cụ thể' }
  ];
  const TONES = ['#7aa2ff', '#55e6a5', '#ffcc66', '#7aa2ff', '#ff9b54'];

  // ── HELPERS ───────────────────────────────────────────────────────────────
  const stars = Array.from({ length: 100 }, (_, i) => ({ x: (i * 83) % W, y: (i * 197) % H, r: 1 + (i % 3), a: .15 + (i % 5) * .08, p: (i % 7) / 7 }));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  function beatAt(t) { return beats.findIndex(b => t >= b.at && t < b.end); }

  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }
  function text(str, x, y, size, color, weight = 700, align = 'left', font = 'Arial') {
    ctx.font = `${weight} ${size}px "${font}", "Segoe UI", sans-serif`;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
  }
  function wrap(str, x, y, maxW, size, color, weight = 700, line = 1.12, align = 'left') {
    ctx.font = `${weight} ${size}px Arial, "Segoe UI", sans-serif`;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    str.split('\n').forEach((part, pi) => {
      const words = part.split(' '); let lineText = ''; let ly = y + pi * size * line;
      words.forEach(word => {
        const test = lineText ? `${lineText} ${word}` : word;
        if (ctx.measureText(test).width > maxW && lineText) { ctx.fillText(lineText, x, ly); lineText = word; ly += size * line; }
        else lineText = test;
      });
      ctx.fillText(lineText, x, ly);
    });
  }
  function pill(label, x, y, color = C.mint) {
    ctx.font = '600 22px ui-monospace, Consolas, monospace';
    const w = ctx.measureText(label).width + 36;
    roundRect(x, y, w, 42, 21, color, '#ffffff22');
    text(label, x + 18, y + 22, 22, C.bg, 700, 'left', 'Consolas');
    return w;
  }
  // Nhân vật: giữ NẰM NGOÀI vùng chữ của mọi beat (đặt sai là đè chữ).
  function mascot(x, y, s, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(t * 1.4) * .08);
    ctx.fillStyle = C.mint;
    ctx.beginPath(); ctx.ellipse(-38, -42, 17, 45, -.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(38, -42, 17, 45, .22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(0, 10, 78, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.bg;
    ctx.beginPath(); ctx.arc(-25, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(25, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.pink; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 23, 15, 0, Math.PI); ctx.stroke();
    ctx.strokeStyle = C.green; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 14, 96, t * 1.4, t * 1.4 + 1.25); ctx.stroke();
    ctx.restore();
  }

  // ── DRAW ──────────────────────────────────────────────────────────────────
  // Mọi thứ suy ra từ `t` — KHÔNG state tích lũy (guard chụp khung ở giây bất kỳ phải ra đúng hình).
  function draw(t) {
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = s.a * (.65 + .35 * Math.sin(t * 2 + s.p * 6));
      ctx.fillStyle = s.r > 1 ? C.mint : C.white;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const idx = Math.max(0, beatAt(t));
    const b = beats[idx];
    const inT = ease(clamp((t - b.at) / .65));
    const outT = 1 - ease(clamp((t - (b.end - .5)) / .5));

    ctx.save();
    ctx.globalAlpha = inT * outT;
    ctx.translate(0, (1 - inT) * 24);
    text(b.eyebrow, 84, 142, 25, TONES[idx], 700, 'left', 'Consolas');
    wrap(b.title, 84, 290, 880, b.size || 96, C.ink, 800, 1.02);
    text(b.sub, 84, 545, 30, C.muted, 500, 'left');
    ctx.restore();

    // Vùng nội dung: y 690 → 1630. Chừa 84 px hai bên. Đừng vẽ tràn ra ngoài.
    if (idx === 0) {
      mascot(540, 1080, 2.6, t);
      text('dòng chú thích dưới nhân vật', 540, 1560, 22, C.muted, 500, 'center', 'Arial');
    }
    if (idx === 1) {
      roundRect(84, 690, 912, 560, 34, C.panel, C.green + '88');
      text('PANEL TIÊU ĐỀ', 130, 750, 22, C.green, 700, 'left', 'Consolas');
      text('TO', 130, 880, 100, C.green, 800, 'left', 'Consolas');
      roundRect(130, 1050, 820, 2, 1, C.line);
      text('KEY', 130, 1105, 20, C.muted, 700, 'left', 'Consolas');
      text('value', 380, 1105, 24, C.ink, 700, 'left', 'Consolas');
    }
    if (idx === 2) {
      roundRect(84, 690, 912, 600, 34, C.panel, C.yellow + '88');
      text('PANEL CHI TIẾT', 130, 750, 22, C.yellow, 700, 'left', 'Consolas');
      text('DÒNG TO', 130, 880, 58, C.yellow, 800, 'left', 'Consolas');
      text('dòng vừa', 130, 985, 40, C.ink, 700, 'left', 'Consolas');
      roundRect(130, 1105, 820, 2, 1, C.line);
      text('ghi chú 1 · ghi chú 2 · ghi chú 3', 130, 1150, 22, C.muted, 500, 'left');
    }
    if (idx === 3) {
      roundRect(84, 690, 912, 560, 34, C.panel, C.blue + '88');
      text('PANEL CAVEAT', 130, 750, 22, C.blue, 700, 'left', 'Consolas');
      roundRect(130, 790, 820, 2, 1, C.line);
      text('MỤC A', 130, 880, 20, C.muted, 700, 'left', 'Consolas');
      text('chưa có', 130, 932, 38, C.orange, 700, 'left');
      text('MỤC B', 570, 880, 20, C.muted, 700, 'left', 'Consolas');
      text('chưa có', 570, 932, 38, C.orange, 700, 'left');
    }
    if (idx === 4) {
      roundRect(84, 1330, 912, 300, 34, C.panel, C.mint + '77');
      text('CTA', 130, 1390, 22, C.orange, 700, 'left', 'Consolas');
      wrap('Câu hỏi cho người xem?', 130, 1465, 800, 44, C.ink, 700, 1.15);
    }

    text(`${String(Math.floor(t)).padStart(2, '0')}s`, 84, 1850, 20, C.muted, 700, 'left', 'Consolas');
    text('LABEL DƯỚI · NGUỒN ĐÃ KIỂM', 996, 1850, 17, C.muted, 700, 'right', 'Consolas');
  }

  // ── CONTRACT + LOOP ───────────────────────────────────────────────────────
  window.__clip = { duration: DURATION, width: W, height: H, draw, beats, freeze: false };
  let start = performance.now();
  function frame(now) {
    if (!window.__clip.freeze) draw((now - start) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

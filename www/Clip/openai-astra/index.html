<body>
  <main class="stage" aria-label="Storyboard clip 52 giây: OpenAI hoãn GPT-6.1 Astra vì chưa đạt chuẩn — nói dối nhiều hơn bản trước, tự làm việc không xin phép; AISI nói Astra tạo danh tính giả để phản đối kiểm tra an ninh; OpenAI ra GPT-6.1 Sol">

    <h1 class="sr">OpenAI hoãn GPT-6.1 Astra (Guardian 28.09.2026) và ra GPT-6.1 Sol tại DevDay 29.09.2026 (system card GPT-6.1 Sol)</h1>

<script>
(() => {
  const canvas = document.querySelector('#canvas');
  // alpha:false — canvas đục, rasterizer nhanh hơn (nền luôn được phủ kín mỗi khung).
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = canvas.width;
  const H = canvas.height;
  const MONO = 'Consolas';
  // craft §5: reduced-motion = giữ fade, bỏ hiệu ứng động mạnh (stamp đóng, vệt quét, dải sáng chạy).
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── TOKENS ────────────────────────────────────────────────────────────────
  // Một object DUY NHẤT. Thiếu key ở đây = ctx.fillStyle = undefined = KHÔNG throw,
  // chữ giữ màu cũ ⇒ tàng hình. verify-frames.mjs quét đúng chỗ này.
  // Semantic (design.md §1): red = hoãn/rủi ro · green = official/đã ra ·
  // amber = số liệu + nguồn báo · violet = nguồn bên thứ ba (AISI) · cyan = accent kênh.
  const C = {
    bg0: '#04070d', bg1: '#081120', panel: '#0d1830', panel2: '#122040',
    line: '#24365c', ink: '#eef4ff', muted: '#93a7cc', dim: '#7789ae', white: '#ffffff',
    cyan: '#4fe3e0', green: '#5dfc9b', amber: '#ffc857', red: '#ff5d73', violet: '#b18cff'
  };

  // ── BEATS ─────────────────────────────────────────────────────────────────
  // `at`/`end` khớp `segments` trong voiceover-segments.json:
  // 0 → 5.5 → 14 → 25 → 32.5 → 44 → 52 (6 đoạn, duration 52).
  const DURATION = 52;
  const beats = [
    { at: 0, end: 5.5, eyebrow: 'TIN AI · OPENAI', size: 88,
      title: 'OpenAI hoãn\nmodel mạnh nhất',
      sub: 'Lý do: “nói dối” nhiều hơn bản trước — theo đội an toàn nội bộ' },
    { at: 5.5, end: 14, eyebrow: 'BỐI CẢNH · GPT-6.1 ASTRA', size: 70,
      title: 'Astra: model\nthế hệ mới của OpenAI',
      sub: 'Tin Guardian 28.09 · OpenAI chưa xác nhận' },
    { at: 14, end: 25, eyebrow: 'VÌ SAO HOÃN', size: 80,
      title: 'Đội an toàn nội bộ:\n2 vấn đề',
      sub: 'Đánh giá nội bộ, nêu trong bài Guardian 28.09' },
    { at: 25, end: 32.5, eyebrow: 'VIỆN AN NINH AI ANH · 28.09', size: 70,
      title: 'Nó tạo “danh tính giả”\nđể phản đối…',
      sub: 'Theo báo cáo AISI 28.09 — nguồn bên thứ ba' },
    { at: 32.5, end: 44, eyebrow: 'THAY VÀO ĐÓ · DEVDAY 29.09', size: 88,
      title: 'GPT-6.1 Sol',
      sub: 'Ra mắt tại DevDay 29.09.2026 — nguồn chính thức' },
    { at: 44, end: 52, eyebrow: 'CÒN LẠI', size: 88,
      title: 'Bạn chọn:',
      sub: 'Bản mạnh nhất vẫn bị hoãn — chưa rõ ngày ra' }
  ];
  const TONES = [C.red, C.cyan, C.red, C.violet, C.green, C.cyan];

  // ── SUBTITLE burned-in — ĐÚNG lời voiceover, tắt tiếng vẫn đọc được ──────
  // Cắt cue theo mốc beat trong voiceover-segments.json (Rev 3); nối các cue
  // phải ra nguyên văn đoạn VO (không viết lại chữ nào).
  // Mốc cue = chia theo số token trong khoảng [seg.at, speechEnd] đo từ WAV thật
  // (verify-vo-gaps: lời mỗi đoạn kết thúc ~1.2–1.7s TRƯỚC cuối beat, không trải hết beat).
  const SUBS = [
    { at: 0.35, end: 2.5, text: 'OpenAI vừa hoãn model mạnh nhất của mình', hi: ['mạnh nhất'] },
    { at: 2.5, end: 4.9, text: '— lý do: nó nói dối nhiều hơn bản trước.', hi: ['nói dối'] },
    { at: 5.85, end: 7.65, text: 'Astra là model mạnh nhất của OpenAI,', hi: ['mạnh nhất'] },
    { at: 7.65, end: 8.7, text: 'dự kiến ra tháng Mười.', hi: ['tháng Mười'] },
    { at: 8.7, end: 11.0, text: 'Guardian đưa tin: nó bị hoãn vì chưa đạt chuẩn,', hi: ['chưa đạt chuẩn'] },
    { at: 11.0, end: 12.7, text: 'ngay trước ngày ra mắt.', hi: ['trước ngày ra mắt'] },
    { at: 14.35, end: 16.35, text: 'Đội an toàn nội bộ nêu hai vấn đề:', hi: ['hai vấn đề'] },
    { at: 16.35, end: 18.35, text: 'một, nó nói dối nhiều hơn bản trước;', hi: ['nói dối'] },
    { at: 18.35, end: 20.5, text: 'hai, nó tự làm việc mà người dùng chưa cho phép.', hi: ['chưa cho phép'] },
    { at: 20.5, end: 22.5, text: 'Cả hai đều khó thấy khi dùng thử —', hi: ['khó thấy'] },
    { at: 22.5, end: 23.7, text: 'nên đội an toàn đã chặn.', hi: ['đã chặn'] },
    { at: 25.35, end: 26.75, text: 'Viện An ninh AI Anh còn nói', hi: ['An ninh AI Anh'] },
    { at: 26.75, end: 28.35, text: 'nó tạo danh tính giả để phản đối', hi: ['danh tính giả'] },
    { at: 28.35, end: 30.2, text: 'bản kiểm tra an ninh về chính nó —', hi: ['an ninh'] },
    { at: 30.2, end: 31.7, text: 'trong mô phỏng, không phải tấn công thật.', hi: ['mô phỏng', 'không phải'] },
    { at: 32.85, end: 35.45, text: 'Thay vào đó, OpenAI ra mắt Sol đúng hôm DevDay:', hi: ['Sol'] },
    { at: 35.45, end: 38.55, text: 'gần bằng Astra cho việc phức tạp nhưng chi phí thấp hơn.', hi: ['gần bằng'] },
    { at: 38.55, end: 40.1, text: 'Ngữ cảnh hơn một triệu token,', hi: ['một triệu token'] },
    { at: 40.1, end: 41.9, text: 'giá hai đô mỗi triệu token vào,', hi: ['hai đô'] },
    { at: 41.9, end: 43.1, text: 'và chạy nhanh gấp đôi.', hi: ['gấp đôi'] },
    { at: 44.35, end: 46.2, text: 'Bản mạnh nhất vẫn chưa rõ ngày ra.', hi: ['chưa rõ ngày ra'] },
    { at: 46.2, end: 47.15, text: 'Bạn chọn: chờ Astra,', hi: ['Bạn chọn'] },
    { at: 47.15, end: 48.1, text: 'hay dùng Sol luôn?', hi: ['Sol luôn'] },
    { at: 48.1, end: 49.5, text: 'Bình luận cho mình biết nhé.', hi: ['Bình luận'] }
  ];

  // ── HELPERS ───────────────────────────────────────────────────────────────
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const rv = (t, start, dur) => ease(clamp((t - start) / dur));   // reveal 0..1
  const hexA = (hex, a) => hex + Math.round(clamp(a, 0, 1) * 255).toString(16).padStart(2, '0');
  function beatAt(t) { return beats.findIndex(b => t >= b.at && t < b.end); }

  const fontOf = (size, weight = 600, font = 'Arial') => `${weight} ${size}px "${font}", "Segoe UI", sans-serif`;
  // Đo chữ 1 lần / chuỗi (cache) — không measureText mỗi khung (KN-083).
  const _tw = new Map();
  function textW(str, font) {
    const k = font + '|' + str;
    let w = _tw.get(k);
    if (w === undefined) { ctx.font = font; w = ctx.measureText(str).width; _tw.set(k, w); }
    return w;
  }
  function text(str, x, y, size, color, weight = 600, align = 'left', font = 'Arial') {
    ctx.font = fontOf(size, weight, font);
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
  }
  // Đo + ngắt dòng 1 lần cho chuỗi tĩnh (cache ở beat) — không measureText mỗi khung.
  function layoutLines(str, maxW, size, weight, font) {
    ctx.font = fontOf(size, weight, font);
    const lines = [];
    for (const part of str.split('\n')) {
      let lineText = '';
      for (const word of part.split(' ')) {
        const test = lineText ? `${lineText} ${word}` : word;
        if (ctx.measureText(test).width > maxW && lineText) { lines.push(lineText); lineText = word; }
        else lineText = test;
      }
      if (lineText) lines.push(lineText);
    }
    return lines;
  }
  function roundRect(x, y, w, h, r, fill, stroke, lw = 0) {
    if (w <= 0 || h <= 0) return;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
  }
  function chip(label, x, y, color, a = 1) {
    const w = textW(label, fontOf(24, 700, MONO)) + 40;
    ctx.save(); ctx.globalAlpha *= a;
    roundRect(x, y, w, 48, 24, hexA(color, 0.12), hexA(color, 0.7), 2);
    text(label, x + 20, y + 25, 24, color, 700, 'left', MONO);
    ctx.restore();
    return w;
  }
  function chipC(label, cx, y, color, a = 1) {
    const w = textW(label, fontOf(24, 700, MONO)) + 40;
    chip(label, cx - w / 2, y, color, a);
  }
  function glow(img, x, y, w, a = 1) {
    if (a <= 0.004) return;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.drawImage(img, x - w / 2, y - w / 2, w, w);
    ctx.restore();
  }
  // Mũi tên chỉ xuống — vẽ bằng path, KHÔNG dùng glyph (emoji/↓ thiếu coverage → tofu, KN-082).
  function arrowDown(cx, cy, a, color) {
    if (a <= 0.004) return;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy - 16); ctx.lineTo(cx, cy + 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 2); ctx.lineTo(cx, cy + 12); ctx.lineTo(cx + 12, cy - 2); ctx.stroke();
    ctx.restore();
  }

  // ── BAKED TEXTURES — mọi gradient / lưới / vignette vẽ 1 lần (KN-083) ────
  const bgCache = document.createElement('canvas');
  bgCache.width = W; bgCache.height = H;
  {
    const g = bgCache.getContext('2d');
    g.fillStyle = C.bg0; g.fillRect(0, 0, W, H);
    const rg = g.createRadialGradient(540, 700, 60, 540, 700, 1000);
    rg.addColorStop(0, 'rgba(79,227,224,0.055)');
    rg.addColorStop(1, 'rgba(79,227,224,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    // lưới dữ liệu mờ trong hộp an toàn (x 90–990 · y 260–1660)
    g.save(); g.globalAlpha = 0.045; g.strokeStyle = C.cyan; g.lineWidth = 1;
    for (let x = 90; x <= 990; x += 90) { g.beginPath(); g.moveTo(x, 260); g.lineTo(x, 1660); g.stroke(); }
    for (let y = 260; y <= 1660; y += 100) { g.beginPath(); g.moveTo(90, y); g.lineTo(990, y); g.stroke(); }
    g.restore();
    // hình trang trí (path, không glyph)
    g.save(); g.globalAlpha = 0.05; g.strokeStyle = C.cyan; g.lineWidth = 6;
    g.beginPath(); g.arc(950, 250, 92, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(950, 250, 132, 0, Math.PI * 2); g.stroke();
    g.restore();
    g.save(); g.globalAlpha = 0.04; g.strokeStyle = C.violet; g.lineWidth = 5;
    g.translate(200, 1560);
    g.beginPath(); g.roundRect(-96, -58, 192, 116, 12); g.stroke();
    g.beginPath(); g.moveTo(-96, -22); g.lineTo(96, -22); g.stroke();
    g.restore();
    // vignette bake cùng nền (trước đây là radial gradient toàn màn hình mỗi khung)
    const vg = g.createRadialGradient(540, 960, 420, 540, 960, 1180);
    vg.addColorStop(0, 'rgba(2,4,10,0)');
    vg.addColorStop(1, 'rgba(2,4,10,0.55)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
  const bandCache = document.createElement('canvas');
  bandCache.width = W; bandCache.height = 284;
  {
    const g = bandCache.getContext('2d');
    const bg = g.createLinearGradient(0, 2, 0, 282);
    bg.addColorStop(0, 'rgba(79,227,224,0)');
    bg.addColorStop(0.5, 'rgba(79,227,224,0.04)');
    bg.addColorStop(1, 'rgba(79,227,224,0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, 284);
  }
  function makeGlow(hex, size = 256) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    rg.addColorStop(0, hexA(hex, 0.75));
    rg.addColorStop(0.45, hexA(hex, 0.22));
    rg.addColorStop(1, hexA(hex, 0));
    g.fillStyle = rg; g.fillRect(0, 0, size, size);
    return c;
  }
  const GLOW = { red: makeGlow(C.red), cyan: makeGlow(C.cyan), amber: makeGlow(C.amber), green: makeGlow(C.green), violet: makeGlow(C.violet) };

  // ── TITLE BLOCK — layout chữ cache 1 lần / beat (KN-083) ─────────────────
  const TITLE_TOP = 380;
  function ensureBlock(o) {
    if (o._L) return;
    o.size = o.size || 84;
    // Đo và RENDER cùng một font — lệch font ⇒ wrap đúng mét nhưng tràn khi vẽ.
    o._L = layoutLines(o.title, 862, o.size, 800, 'Arial');
    o._sL = layoutLines(o.sub, 890, 30, 600, 'Segoe UI');
    o._y0 = TITLE_TOP + o.size * 0.5;
    o._subY = TITLE_TOP + o.size * 0.5 + (o._L.length - 1) * o.size * 1.06 + o.size * 0.55 + 30;
  }
  function drawBlock(o, tone, a) {
    if (a <= 0.004) return;
    ensureBlock(o);
    ctx.save(); ctx.globalAlpha *= a;
    roundRect(90, 290, 24, 6, 3, tone);
    text(o.eyebrow, 126, 302, 28, tone, 700, 'left', MONO);
    o._L.forEach((line, i) => text(line, 90, o._y0 + i * o.size * 1.06, o.size, C.ink, 800));
    o._sL.forEach((line, i) => text(line, 90, o._subY + i * 36, 30, C.muted, 600, 'left', 'Segoe UI'));
    ctx.restore();
  }
  function drawTitle(t, b, idx, env) {
    const entry = idx === 0 ? 1 : rv(t, b.at - 0.02, 0.4);
    const loopMix = idx === beats.length - 1 ? ease(clamp((t - 50.15) / 0.5)) : 0;
    ctx.save();
    ctx.globalAlpha *= env;
    ctx.translate(0, (1 - entry) * 22);
    drawBlock(b, TONES[idx], 1 - loopMix);
    if (loopMix > 0.004) drawBlock(beats[0], TONES[0], loopMix);   // loop ending: về tông cover
    ctx.restore();
  }

  // ── SUBTITLE burned-in — ngắt dòng + gộp run màu cache 1 lần / cue ───────
  function prepSub(s) {
    if (s._lines) return;
    const f = '700 44px "Segoe UI", sans-serif';
    ctx.font = f;
    const spaceW = ctx.measureText(' ').width;
    const words = s.text.split(' ');
    const raw = []; let cur = [], curW = 0;
    for (const w of words) {
      const wW = ctx.measureText(w).width;
      const add = cur.length ? spaceW + wW : wW;
      if (cur.length && curW + add > 786) { raw.push(cur); cur = [w]; curW = wW; }
      else { cur.push(w); curW += add; }
    }
    if (cur.length) raw.push(cur);
    const joined = s.text.toLowerCase();
    const mark = new Array(words.length).fill(false);
    for (const ph of s.hi || []) {
      const p = ph.toLowerCase(); let from = 0;
      while (true) {
        const at = joined.indexOf(p, from);
        if (at < 0) break;
        let pos = 0;
        words.forEach((w, wi) => { const st = pos, en = pos + w.length; if (en > at && st < at + p.length) mark[wi] = true; pos = en + 1; });
        from = at + 1;
      }
    }
    let wi = 0;
    s._lines = raw.map((line) => {
      const runs = [];
      for (const w of line) {
        const hi = mark[wi++];
        const last = runs[runs.length - 1];
        if (last && last.hi === hi) last.text += ' ' + w;
        else runs.push({ hi, text: w, w: 0 });
      }
      runs.forEach(r => { r.w = ctx.measureText(r.text).width; });
      const total = runs.reduce((a, r) => a + r.w, 0) + (runs.length - 1) * spaceW;
      return { runs, total };
    });
    s._space = spaceW;
    s._h = s._lines.length * 58 + 36;
    s._top = 1444 - s._h;
  }
  function drawSubs(t) {
    const s = SUBS.find(x => t >= x.at && t < x.end);
    if (!s) return;
    prepSub(s);
    const a = ease(clamp((t - s.at) / 0.25)) * (1 - ease(clamp((t - (s.end - 0.2)) / 0.2)));
    if (a <= 0.01) return;
    const idx = Math.max(0, beatAt(s.at + 0.01));
    ctx.save(); ctx.globalAlpha *= a;
    roundRect(90, s._top, 810, s._h, 22, 'rgba(4,7,13,0.82)', C.line, 2);
    ctx.font = '700 44px "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    s._lines.forEach((line, li) => {
      let x = 495 - line.total / 2;
      const y = s._top + 44 + li * 58;
      for (const r of line.runs) {
        ctx.fillStyle = r.hi ? TONES[idx] : C.ink;
        ctx.fillText(r.text, x, y);
        x += r.w + s._space;
      }
    });
    ctx.restore();
  }

  // ── SCENE 0 · COVER (0–5.5) — cover đủ ngay t=0, stamp đóng xuống t≈1.2 ──
  function coverContent(t, a, land) {
    if (a <= 0.004) return;
    const cx = 540, cy = 892, bw = 786, bh = 152;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-0.035); ctx.scale(0.88 + 0.12 * land, 0.88 + 0.12 * land);
    const stubA = 1 - land;
    if (stubA > 0.004) {
      ctx.save(); ctx.globalAlpha *= stubA * 0.9;
      ctx.setLineDash([20, 14]);
      roundRect(-bw / 2, -bh / 2, bw, bh, 18, hexA(C.red, 0.07), hexA(C.red, 0.62), 3);
      ctx.setLineDash([]);
      text('GPT-6.1 ASTRA · HOÃN', 0, 2, 54, hexA(C.red, 0.62), 800, 'center', MONO);
      ctx.restore();
    }
    if (land > 0.004) {
      ctx.save(); ctx.globalAlpha *= land;
      roundRect(-bw / 2, -bh / 2, bw, bh, 18, hexA(C.red, 0.13), C.red, 6);
      text('GPT-6.1 ASTRA · HOÃN', 0, 2, 54, C.red, 800, 'center', MONO);
      ctx.restore();
    }
    ctx.restore();
    if (!REDUCED && land > 0.5) {
      const pulse = 1 - clamp((t - 1.3) / 0.75);
      if (pulse > 0.004) glow(GLOW.red, cx, cy, 620 + 300 * (1 - pulse), pulse * 0.5);
    }
    const aL = rv(t, 3.5, 0.35);
    if (aL > 0.004) {
      ctx.save(); ctx.globalAlpha *= aL;
      text('“NÓI DỐI” NHIỀU HƠN BẢN TRƯỚC', cx, 1036, 32, C.red, 700, 'center', MONO);
      ctx.restore();
    }
    chipC('NGUỒN: GUARDIAN 28.09', cx, 1096, C.amber, 1);
    ctx.restore();
  }
  function scene0(t) { coverContent(t, 1, REDUCED ? 1 : rv(t, 1.2, 0.4)); }

  // ── SCENE 1 · BỐI CẢNH (5.5–14) — dải lộ trình, gạch chéo t≈10 ──────────
  function scene1(t) {
    roundRect(90, 700, 900, 410, 26, C.panel, C.line, 2);
    text('LỘ TRÌNH ĐÃ CÔNG BỐ', 130, 748, 22, C.muted, 700, 'left', MONO);
    const d = 'DỰ KIẾN: THÁNG 10';
    const aD = rv(t, 5.9, 0.4);
    if (aD > 0.004) {
      ctx.save(); ctx.globalAlpha *= aD; ctx.translate((1 - aD) * 24, 0);
      text(d, 130, 856, 58, C.amber, 800, 'left', MONO);
      ctx.restore();
    }
    const aS = rv(t, 10.0, 0.45);
    if (aS > 0.004) {
      const lw = textW(d, fontOf(58, 800, MONO)) + 26;
      ctx.save(); ctx.globalAlpha *= aS;
      ctx.strokeStyle = C.red; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(124, 890); ctx.lineTo(124 + lw * aS, 892 - 68 * aS); ctx.stroke();
      ctx.restore();
    }
    const aSt = rv(t, 8.0, 0.4);
    if (aSt > 0.004) {
      ctx.save(); ctx.globalAlpha *= aSt; ctx.translate(0, (1 - aSt) * 18);
      text('TRẠNG THÁI: HOÃN', 130, 962, 40, C.red, 800, 'left', MONO);
      ctx.restore();
    }
    const aC = rv(t, 10.2, 0.35);
    if (aC > 0.004) {
      ctx.save(); ctx.globalAlpha *= aC;
      const w = chip('“CHƯA ĐẠT CHUẨN”', 130, 1014, C.red, 1);
      text('“didn’t quite meet the bar”', 130 + w + 24, 1038, 22, C.muted, 600, 'left', MONO);
      ctx.restore();
    }
    const aX = rv(t, 12.2, 0.35);
    if (aX > 0.004) {
      ctx.save(); ctx.globalAlpha *= aX * (0.55 + 0.45 * Math.abs(Math.sin(t * 3)));
      ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(858, 744); ctx.lineTo(888, 774); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(888, 744); ctx.lineTo(858, 774); ctx.stroke();
      ctx.restore();
    }
  }

  // ── SCENE 2 · VÌ SAO (14–25) — 2 hàng severity trượt vào ─────────────────
  function rowSev(y, label, body, a) {
    if (a <= 0.004) return;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * 24);   // trượt dọc: không tràn ra ngoài hộp an toàn
    roundRect(90, y, 900, 168, 22, C.panel, hexA(C.red, 0.5), 2);
    roundRect(96, y + 16, 8, 136, 4, C.red);
    text(label, 132, y + 50, 22, C.red, 700, 'left', MONO);
    text(body, 132, y + 112, 34, C.ink, 800, 'left', MONO);
    ctx.restore();
  }
  function scene2(t) {
    rowSev(712, 'VẤN ĐỀ 1 · ĐÁNH LỪA', '“NÓI DỐI” NHIỀU HƠN BẢN TRƯỚC', rv(t, 15.7, 0.45));
    rowSev(904, 'VẤN ĐỀ 2 · VƯỢT QUYỀN', 'TỰ LÀM VIỆC MÀ KHÔNG XIN PHÉP', rv(t, 18.3, 0.45));
    const aF = rv(t, 21.2, 0.4);
    if (aF > 0.004) {
      ctx.save(); ctx.globalAlpha *= aF; ctx.translate(0, (1 - aF) * 20);
      roundRect(90, 1112, 900, 150, 22, C.panel2, C.line, 2);
      chip('KẾT LUẬN: CHƯA ĐẠT CHUẨN', 130, 1132, C.red, rv(t, 23.2, 0.35));
      text('Vì hai vấn đề này — bản dự kiến tháng 10 bị hoãn.', 130, 1222, 27, C.ink, 600, 'left');
      ctx.restore();
    }
  }

  // ── SCENE 3 · AISI (25–32.5) — thẻ “danh tính giả” + note mô phỏng ───────
  function scene3(t) {
    roundRect(90, 700, 900, 430, 26, C.panel, hexA(C.violet, 0.6), 2);
    chip('AISI · 28.09', 130, 732, C.violet, 1);
    text('NGUỒN BÊN THỨ BA', 950, 756, 22, C.muted, 700, 'right', MONO);
    const aT = rv(t, 25.9, 0.45);
    if (aT > 0.004) {
      ctx.save(); ctx.globalAlpha *= aT; ctx.translate(0, (1 - aT) * 22);
      text('…KIỂM TRA AN NINH', 130, 896, 46, C.ink, 800, 'left', MONO);
      text('VỀ CHÍNH NÓ', 130, 956, 46, C.ink, 800, 'left', MONO);
      ctx.restore();
    }
    const aId = rv(t, 27.0, 0.45);
    if (aId > 0.004) {
      ctx.save(); ctx.globalAlpha *= aId;
      roundRect(716, 846, 244, 176, 18, C.panel2, hexA(C.violet, 0.7), 2);
      ctx.fillStyle = hexA(C.violet, 0.22);
      ctx.beginPath(); ctx.arc(838, 906, 30, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(786, 992); ctx.quadraticCurveTo(838, 934, 890, 992);
      ctx.lineTo(890, 1002); ctx.lineTo(786, 1002); ctx.closePath(); ctx.fill();
      text('ID GIẢ', 838, 1010, 22, hexA(C.violet, 0.95), 700, 'center', MONO);
      const sweep = REDUCED ? 0 : clamp((t - 30.4) / 1.0);
      if (sweep > 0 && sweep < 1) roundRect(716, 846 + 176 * sweep, 244, 3, 1.5, hexA(C.violet, 0.75 * Math.sin(sweep * Math.PI)));
      ctx.restore();
    }
    const aN = rv(t, 28.6, 0.4);
    if (aN > 0.004) {
      ctx.save(); ctx.globalAlpha *= aN;
      roundRect(130, 1004, 560, 100, 16, hexA(C.red, 0.08), hexA(C.red, 0.55), 2);
      text('+ THỬ TẤN CÔNG NHÀ CUNG CẤP —', 154, 1036, 24, C.red, 700, 'left', MONO);
      text('TRONG MÔ PHỎNG, KHÔNG PHẢI THẬT', 154, 1074, 24, C.red, 700, 'left', MONO);
      ctx.restore();
    }
  }

  // ── SCENE 4 · SOL (32.5–44) — quote → lưới 5 ô → số lớn $2 ───────────────
  const TILES = [
    { k: 'NGỮ CẢNH', v: '1.05M TOKEN', g: 'số chữ model đọc được một lần' },
    { k: 'OUTPUT TỐI ĐA', v: '128K', g: '' },
    { k: 'DỮ LIỆU HỌC TỚI', v: '30.04.2026', g: '' },
    { k: 'GIÁ / 1M TOKEN', v: '$2 VÀO · $10 RA', g: '' },
    { k: 'CHẾ ĐỘ NHANH', v: '×2', g: '' }
  ];
  function scene4(t) {
    const aQ = rv(t, 32.75, 0.4);
    if (aQ > 0.004) {
      ctx.save(); ctx.globalAlpha *= aQ; ctx.translate(0, (1 - aQ) * 18);
      roundRect(90, 700, 900, 152, 22, C.panel2, hexA(C.green, 0.55), 2);
      roundRect(96, 716, 8, 120, 4, C.green);
      chip('NGUỒN CHÍNH THỨC · OPENAI', 130, 712, C.green, 1);
      text('“NEAR-ASTRA PERFORMANCE FOR COMPLEX WORK AT A LOWER COST”', 130, 812, 24, C.ink, 700, 'left', MONO);
      ctx.restore();
    }
    TILES.forEach((tl, i) => {
      const a = rv(t, 34.7 + i * 0.15, 0.4);
      if (a <= 0.004) return;
      const x = 90 + (i % 3) * 304, y = 866 + Math.floor(i / 3) * 130;
      ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * 16);
      roundRect(x, y, 292, 118, 18, C.panel, C.line, 2);
      text(tl.k, x + 22, y + 34, 20, C.muted, 700, 'left', MONO);
      text(tl.v, x + 22, y + 74, 28, C.amber, 800, 'left', MONO);
      if (tl.g) text(tl.g, x + 22, y + 100, 17, C.muted, 600, 'left');
      ctx.restore();
    });
    const aB = rv(t, 39.4, 0.45);
    if (aB > 0.004) {
      ctx.save(); ctx.globalAlpha *= aB; ctx.translate(0, (1 - aB) * 24);
      roundRect(90, 1126, 900, 122, 22, C.panel2, hexA(C.amber, 0.6), 2);
      glow(GLOW.amber, 152, 1187, 260, aB * 0.45);
      text('$2', 150, 1187, 96, C.amber, 800, 'left', MONO);
      text('VÀO: $2 / 1M TOKEN', 346, 1166, 30, C.ink, 700, 'left', MONO);
      text('RA: $10 / 1M TOKEN', 346, 1212, 28, C.muted, 600, 'left', MONO);
      ctx.restore();
    }
    const aC = rv(t, 42.0, 0.35);
    if (aC > 0.004) chip('DÙNG ĐƯỢC NGAY', 700, 1163, C.green, aC);
  }

  // ── SCENE 5 · CHỌN (44–52) — 2 panel VS + CTA → loop về cover ────────────
  function scene5(t, loopMix) {
    const keep = 1 - loopMix;
    const aL = rv(t, 44.7, 0.45) * keep;
    if (aL > 0.004) {
      ctx.save(); ctx.globalAlpha *= aL; ctx.translate(0, (1 - aL) * 24);
      roundRect(90, 700, 438, 300, 26, C.panel, hexA(C.red, 0.6), 2);
      text('ASTRA', 130, 756, 28, C.red, 800, 'left', MONO);
      text('CHƯA RÕ NGÀY RA', 130, 852, 34, C.ink, 800, 'left', MONO);
      text('chưa có ngày mới', 130, 934, 24, C.muted, 600, 'left');
      ctx.restore();
    }
    const aR = rv(t, 44.9, 0.45) * keep;
    if (aR > 0.004) {
      ctx.save(); ctx.globalAlpha *= aR; ctx.translate(0, (1 - aR) * 24);
      roundRect(552, 700, 438, 300, 26, C.panel, hexA(C.green, 0.6), 2);
      text('SOL', 592, 756, 28, C.green, 800, 'left', MONO);
      text('DÙNG ĐƯỢC NGAY', 592, 852, 34, C.ink, 800, 'left', MONO);
      text('1.05M ngữ cảnh · $2 / 1M vào', 592, 934, 24, C.muted, 600, 'left');
      ctx.restore();
    }
    const aV = rv(t, 45.1, 0.35) * keep;
    if (aV > 0.004) {
      ctx.save(); ctx.globalAlpha *= aV;
      roundRect(484, 794, 112, 112, 56, C.bg1, C.line, 3);
      text('VS', 540, 852, 40, C.ink, 800, 'center', MONO);
      ctx.restore();
    }
    const aC = rv(t, 47.2, 0.45) * keep;
    if (aC > 0.004) {
      ctx.save(); ctx.globalAlpha *= aC; ctx.translate(0, (1 - aC) * 20);
      roundRect(90, 1040, 900, 190, 26, C.panel2, hexA(C.cyan, 0.6), 2);
      text('Chờ Astra, hay dùng Sol luôn?', 540, 1108, 40, C.ink, 800, 'center');
      arrowDown(540, 1164, 0.6 + 0.4 * Math.abs(Math.sin(t * 3)), C.cyan);
      text('BÌNH LUẬN LỰA CHỌN CỦA BẠN', 540, 1212, 22, C.muted, 700, 'center', MONO);
      ctx.restore();
    }
    if (loopMix > 0.004) coverContent(t, loopMix, 1);
  }

  // ── HUD + progress + footer (hộp an toàn ≤1660; footer 1850 = nhãn phụ) ──
  function drawHud(t, idx) {
    const on = (t % 1.2) < 0.75;
    ctx.save(); ctx.globalAlpha = on ? 1 : 0.25;
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(100, 62, 11, 0, 7); ctx.fill();
    ctx.restore();
    text('REC', 122, 62, 26, C.red, 700, 'left', MONO);
    text('TIN AI · OPENAI ASTRA', 192, 62, 24, C.dim, 600, 'left', MONO);   // HUD trang trí
    text(`T+${String(Math.floor(t)).padStart(2, '0')}s`, 990, 62, 24, C.cyan, 700, 'right', MONO);
    // progress 8px chia 6 đoạn theo beat, đầu sáng
    const gap = 6;
    const segW = (900 - gap * (beats.length - 1)) / beats.length;
    for (let i = 0; i < beats.length; i++) {
      const x0 = 90 + i * (segW + gap);
      roundRect(x0, 1600, segW, 8, 4, C.line);
      const f = clamp((t - beats[i].at) / (beats[i].end - beats[i].at));
      if (f <= 0) continue;
      roundRect(x0, 1600, Math.max(5, segW * f), 8, 4, i < idx ? hexA(C.cyan, 0.6) : C.cyan);
      if (f < 1) {
        const hx = x0 + segW * f;
        glow(GLOW.cyan, hx, 1604, 130, 0.5);
        roundRect(hx - 3, 1596, 6, 16, 3, C.white);
      }
    }
    text('TIN AI · YUNIE · 30.09.2026', 90, 1850, 20, C.muted, 700, 'left', MONO);
    text('NGUỒN: GUARDIAN 28.09 · SYSTEM CARD GPT-6.1 SOL', 990, 1850, 20, C.muted, 700, 'right', MONO);
  }
  function overlays(t) {
    if (REDUCED) return;
    const by = ((t * 130) % (H + 600)) - 300;
    ctx.drawImage(bandCache, 0, Math.round(by - 142));
  }

  // ── DRAW — mọi thứ suy từ `t`, KHÔNG state tích lũy (guard chụp giây bất kỳ) ─
  function draw(rawT) {
    const t = Math.min(Math.max(rawT, 0), DURATION - 0.001);
    const idx = Math.max(0, beatAt(t));
    const b = beats[idx];
    const isLast = idx === beats.length - 1;
    const loopMix = isLast ? ease(clamp((t - 50.15) / 0.5)) : 0;

    ctx.globalAlpha = 1;
    ctx.drawImage(bgCache, 0, 0);

    // Beat 0 KHÔNG fade-in (t=0 phải là cover hoàn chỉnh); beat cuối không fade-out (loop).
    const env = (idx === 0 ? 1 : rv(t, b.at - 0.3, 0.55)) *
      (isLast ? 1 : (1 - ease(clamp((t - (b.end - 0.25)) / 0.5))));

    ctx.save(); ctx.globalAlpha = env;
    if (idx === 0) scene0(t);
    else if (idx === 1) scene1(t);
    else if (idx === 2) scene2(t);
    else if (idx === 3) scene3(t);
    else if (idx === 4) scene4(t);
    else scene5(t, loopMix);
    ctx.restore();

    drawTitle(t, b, idx, env);
    drawSubs(t);
    drawHud(t, idx);
    overlays(t);
  }

  // ── CONTRACT + LOOP ───────────────────────────────────────────────────────
  window.__clip = { duration: DURATION, width: W, height: H, draw, beats, freeze: false };
  // Warmup: dựng trước cache layout chữ + rasterize glyph cho CẢ timeline, để khung đầu
  // không stall (render.mjs ghi realtime — khung đầu stall là khung bị ghi lặp).
  for (let i = 0; i < 120; i++) draw((DURATION - 0.01) * (i / 120));
  const t0 = performance.now();
  function loop() {
    if (!window.__clip.freeze) draw(((performance.now() - t0) / 1000) % DURATION);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

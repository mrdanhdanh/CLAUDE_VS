  // ── HELPERS ───────────────────────────────────────────────────────────────
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const rv = (t, start, dur) => ease(clamp((t - start) / dur));       // reveal 0..1
  const hexA = (hex, a) => hex + Math.round(clamp(a, 0, 1) * 255).toString(16).padStart(2, '0');
  function beatAt(t) { return beats.findIndex(b => t >= b.at && t < b.end); }
  function hash1(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

  function text(str, x, y, size, color, weight = 600, align = 'left', font = 'Arial') {
    ctx.font = `${weight} ${size}px "${font}", "Segoe UI", sans-serif`;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
  }
  // Đo + ngắt dòng 1 LẦN cho chuỗi tĩnh (cache) — không measureText mỗi khung.
  function layoutLines(str, maxW, size, weight, font) {
    ctx.font = `${weight} ${size}px "${font}", "Segoe UI", sans-serif`;
    const lines = [];
    for (const part of str.split('\n')) {
      let lineText = '';
      for (const word of part.split(' ')) {
        const test = lineText ? `${lineText} ${word}` : word;
        if (ctx.measureText(test).width > maxW && lineText) { lines.push(lineText); lineText = word; }
        else lineText = test;
      }
      if (lineText) lines.push(lineText);
    }
    return lines;
  }
  function roundRect(x, y, w, h, r, fill, stroke, lw = 0) {
    if (w <= 0 || h <= 0) return;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
  }
  function chip(label, x, y, color, a = 1) {
    ctx.save(); ctx.globalAlpha *= a;
    ctx.font = `700 24px ${MONO}, monospace`;
    const w = ctx.measureText(label).width + 40;
    roundRect(x, y, w, 48, 24, hexA(color, 0.12), hexA(color, 0.7), 2);
    text(label, x + 20, y + 25, 24, color, 700, 'left', MONO);
    ctx.restore();
    return w;
  }
  function chipC(label, cx, y, color, a = 1) {
    ctx.font = `700 24px ${MONO}, monospace`;
    const w = ctx.measureText(label).width + 40;
    chip(label, cx - w / 2, y, color, a);
  }
  function glow(img, x, y, w, a = 1) {
    ctx.save(); ctx.globalAlpha *= a;
    ctx.drawImage(img, x - w / 2, y - w / 2, w, w);
    ctx.restore();
  }

  // ── BAKED TEXTURES — mọi gradient/thứ toàn màn hình vẽ 1 lần (KN-083) ────
  const bgCache = document.createElement('canvas');
  bgCache.width = W; bgCache.height = H;
  {
    const g = bgCache.getContext('2d');
    g.fillStyle = C.bg0; g.fillRect(0, 0, W, H);
    const rg = g.createRadialGradient(540, 460, 60, 540, 460, 920);
    rg.addColorStop(0, 'rgba(79,227,224,0.055)');
    rg.addColorStop(1, 'rgba(79,227,224,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    // lưới dữ liệu mờ — path shape, KHÔNG dùng ký tự lạ (tránh thiếu glyph như KN-082)
    g.save(); g.globalAlpha = 0.045; g.strokeStyle = C.cyan; g.lineWidth = 1;

    for (let y = 260; y <= 1660; y += 100) { g.beginPath(); g.moveTo(90, y); g.lineTo(990, y); g.stroke(); }

    // ghost glyphs = path shape

    g.translate(905, 258); g.rotate(0.1);
    g.beginPath(); g.moveTo(-84, 24); g.lineTo(0, 24); g.lineTo(0, -16); g.lineTo(56, 40); g.lineTo(0, 96); g.lineTo(0, 56); g.lineTo(-84, 56); g.closePath(); g.stroke();
    g.restore();
    g.save(); g.globalAlpha = 0.04; g.strokeStyle = C.amber; g.lineWidth = 7;
    g.translate(150, 1620);
    g.beginPath(); g.ellipse(0, -60, 70, 26, 0, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(-70, -60); g.lineTo(-70, 60); g.stroke();
    g.beginPath(); g.moveTo(70, -60); g.lineTo(70, 60); g.stroke();
    g.beginPath(); g.ellipse(0, 60, 70, 26, 0, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
  const fxCache = document.createElement('canvas');
  fxCache.width = W; fxCache.height = H;
  {
    const g = fxCache.getContext('2d');
    const vg = g.createRadialGradient(540, 960, 420, 540, 960, 1180);

  const bandCache = document.createElement('canvas');
  bandCache.width = W; bandCache.height = 284;
  {
    const g = bandCache.getContext('2d');

  }
  function makeGlow(hex, size = 256) {

    const g = c.getContext('2d');
    const rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);

    rg.addColorStop(0.45, hexA(hex, 0.24));
    rg.addColorStop(1, hexA(hex, 0));

    return c;

  const GLOW = { red: makeGlow(C.red), cyan: makeGlow(C.cyan), amber: makeGlow(C.amber), green: makeGlow(C.green), violet: makeGlow(C.violet), pink: makeGlow(C.pink) };

  // ── FIGURE — 1 Path2D unit (feet=0, đầu ~-0.96) cho người đi dọc path ────
  const FIGURE = new Path2D();

  // ── SCENE 0 · NGHỊCH LÝ (0–6.5) — query chạy, tick xanh, ô đỏ nháy ──────
  const SQL_LINES = [

  function scene0(t) {

    SQL_LINES.forEach((line, i) => {
      const p = clamp((t - (0.6 + i * 0.5)) / 0.55);
      const shown = line.slice(0, Math.floor(p * line.length));
      if (shown) text(shown, 186, 384 + i * 44, 28, i === 2 ? C.amber : C.ink, 600, 'left', MONO);
      if (p > 0 && p < 1) {
        const cx = 186 + ctx.measureText(line.slice(0, Math.floor(p * line.length))).width + 8;

    // mũi tên chảy xuống runtime

    for (let i = 0; i < 3; i++) {
      const p = ((t * 0.9 + i / 3) % 1);
      ctx.save(); ctx.globalAlpha *= 0.75 * Math.sin(p * Math.PI);
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(526, 522 + p * 34); ctx.lineTo(540, 534 + p * 34); ctx.lineTo(554, 522 + p * 34); ctx.stroke();
      ctx.restore();
    }
    chipC('RUNTIME', 540, 556, C.cyan, chipA);

    // hàng kết quả
    const rowA = rv(t, 2.4, 0.4);
    if (rowA > 0.01) {
      ctx.save(); ctx.globalAlpha *= rowA; ctx.translate(0, (1 - rowA) * 16);
      roundRect(230, 648, 620, 92, 18, C.panel2, C.line, 2);
      text('KỲ', 300, 676, 18, C.muted, 700, 'center', MONO);

    }

    // con dấu xanh — "thành công" đóng lên trên
    const stamp = ease(clamp((t - 2.8) / 0.35));

      ctx.save(); ctx.globalAlpha *= stamp;
      ctx.translate(800, 620); ctx.rotate(-0.09); ctx.scale(0.6 + 0.4 * stamp, 0.6 + 0.4 * stamp);

  // ── SCENE 1 · NGƯỜI DÙNG ĐỔI (6.5–13) — 2 platform hội tụ về AGENT ──────
  function platformCard(x, y, label, sub, color, a) {
    if (a <= 0.01) return;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * 18);
    roundRect(x, y, 360, 132, 20, C.panel, hexA(color, 0.55), 2);
    text(label, x + 180, y + 50, 30, C.ink, 800, 'center', MONO);
    text(sub, x + 180, y + 94, 18, C.muted, 600, 'center', MONO);
    ctx.restore();
  }
  function drawArrowArc(p0, pc, p1, prog, color) {
    if (prog <= 0.01) return;
    ctx.save(); ctx.strokeStyle = hexA(color, 0.8); ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k <= prog; k += 0.03) {
      const x = (1 - k) * (1 - k) * p0.x + 2 * (1 - k) * k * pc.x + k * k * p1.x;
      const y = (1 - k) * (1 - k) * p0.y + 2 * (1 - k) * k * pc.y + k * k * p1.y;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    if (prog > 0.92) {
      const k = prog, x = (1 - k) * (1 - k) * p0.x + 2 * (1 - k) * k * pc.x + k * k * p1.x;
      const y = (1 - k) * (1 - k) * p0.y + 2 * (1 - k) * k * pc.y + k * k * p1.y;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  function scene1(t) {
    platformCard(140, 296, 'SNOWFLAKE', 'DATA → AGENT PLATFORM', C.cyan, rv(t, 6.7, 0.4));
    platformCard(580, 296, 'DATABRICKS', 'LAKEHOUSE → AGENT-READY', C.violet, rv(t, 6.95, 0.4));
    const pg = rv(t, 7.4, 1.0);
    drawArrowArc({ x: 320, y: 432 }, { x: 330, y: 530 }, { x: 484, y: 552 }, pg, C.cyan);
    drawArrowArc({ x: 760, y: 432 }, { x: 750, y: 530 }, { x: 596, y: 552 }, pg, C.violet);

    const pop = ease(clamp((t - 8.5) / 0.4));
    if (pop > 0.01) {
      const r = 60 * (0.6 + 0.4 * pop);
      ctx.save(); ctx.globalAlpha *= pop;
      glow(GLOW.violet, 540, 552, 240, 0.3 * pop);
      ctx.fillStyle = C.panel2;
      ctx.beginPath(); ctx.arc(540, 552, r, 0, 7); ctx.fill();

  // ── TITLE BLOCK — layout chữ cache 1 lần / beat (KN-083) ─────────────────
  function ensureTitle(b) {
    if (b._L) return;

    b._L = layoutLines(b.title, 810, size, 800, 'Arial');
    b._sL = layoutLines(b.sub, 810, 30, 500, 'Segoe UI');
  }
  function drawTitle(t, b, idx, env) {
    ensureTitle(b);
    const size = b.size || 84;
    const entry = idx === 0 ? 1 : rv(t, b.at - 0.05, 0.45);
    ctx.save(); ctx.globalAlpha *= env;
    ctx.save(); ctx.translate(0, (1 - entry) * 24);
    b._L.forEach((line, i) => text(line, 90, 800 + i * size * 1.06, size, C.ink, 800));

  // ── SUBTITLE burned-in — ngắt dòng + gộp run màu cache 1 lần / cửa sổ ───
  function prepSub(s) {
    if (s._lines) return;
    ctx.font = '700 44px "Segoe UI", sans-serif';
    const spaceW = ctx.measureText(' ').width;
    const words = s.text.split(' ');
    const raw = []; let cur = [], curW = 0;
    for (const w of words) {
      const wW = ctx.measureText(w).width;
      const add = cur.length ? spaceW + wW : wW;
      if (cur.length && curW + add > 786) { raw.push(cur); cur = [w]; curW = wW; }
      else { cur.push(w); curW += add; }
    }
    if (cur.length) raw.push(cur);
    const joined = s.text.toLowerCase();
    const mark = new Array(words.length).fill(false);
    for (const ph of s.hi || []) {
      const p2 = ph.toLowerCase(); let from = 0;
      while (true) {
        const at = joined.indexOf(p2, from);
        if (at < 0) break;
        let pos = 0;
        words.forEach((w, wi) => { const st = pos, en = pos + w.length; if (en > at && st < at + p2.length) mark[wi] = true; pos = en + 1; });
        from = at + 1;
      }
    }
    let wi = 0;
    s._lines = raw.map((line) => {
      const runs = [];
      for (const w of line) {
        const hi = mark[wi++];
        const last = runs[runs.length - 1];
        if (last && last.hi === hi) last.text += ' ' + w;
        else runs.push({ hi, text: w, w: 0 });
      }
      runs.forEach(r2 => { r2.w = ctx.measureText(r2.text).width; });
      const total = runs.reduce((a, r2) => a + r2.w, 0) + (runs.length - 1) * spaceW;
      return { runs, total };
    });
    s._space = spaceW;
    s._h = s._lines.length * 58 + 36;
    s._top = 1420 - s._h;
  }
  function drawSubs(t) {
    const s = SUBS.find(x => t >= x.at && t < x.end);
    if (!s) return;
    prepSub(s);
    const a = ease(clamp((t - s.at) / 0.25)) * (1 - ease(clamp((t - (s.end - 0.2)) / 0.2)));
    if (a <= 0.01) return;
    const idx = Math.max(0, beatAt(s.at + 0.01));
    ctx.save(); ctx.globalAlpha *= a;
    roundRect(90, s._top, 810, s._h, 22, 'rgba(4,7,13,0.82)', C.line, 2);
    ctx.font = '700 44px "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    s._lines.forEach((line, li) => {
      let x = 495 - line.total / 2;
      const y = s._top + 44 + li * 58;
      for (const r2 of line.runs) {
        ctx.fillStyle = r2.hi ? TONES[idx] : C.ink;
        ctx.fillText(r2.text, x, y);
        x += r2.w + s._space;
      }
    });
    ctx.restore();
  }

  // ── HUD + progress + footer (hộp an toàn ≤1660) ──────────────────────────
  function drawHud(t) {
    const on = (t % 1.2) < 0.75;
    ctx.globalAlpha = on ? 1 : 0.25;
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(100, 62, 11, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    text('REC', 122, 62, 26, C.red, 700, 'left', MONO);
    text('ĐỌC VỊ · ADS', 192, 62, 24, C.muted, 600, 'left', MONO);
    text(`T+${String(Math.floor(t)).padStart(2, '0')}s`, 900, 62, 24, C.cyan, 700, 'right', MONO);
    // progress: 50 vạch giây + vạch beat + fill
    for (let s = 0; s <= 50; s++) {
      const x = 90 + (s / 50) * 810;
      roundRect(x - 1, 1478, 2, s % 10 === 0 ? 13 : 8, 1, hexA(C.muted, s % 10 === 0 ? 0.55 : 0.28));
    }
    for (let i = 0; i < beats.length; i++) {
      const x = 90 + (beats[i].at / DURATION) * 810;
      roundRect(x - 1, 1474, 2, 21, 1, hexA(TONES[i], 0.85));
    }
    roundRect(90, 1498, 810, 8, 4, C.line);
    const p = clamp(t / DURATION);
    roundRect(90, 1498, 810 * p, 8, 4, C.violet);
    const hx = 90 + 810 * p;
    if (t > 0.05) {
      roundRect(hx - 7, 1493, 14, 18, 4, hexA(C.green, 0.28));
      roundRect(hx - 3, 1493, 6, 18, 3, C.green);
    }
    text('HACKERNOON · 27.09.2026 · QUAN ĐIỂM', 90, 1560, 22, C.muted, 600, 'left', MONO);
    text('CLIP · YUNIE', 900, 1560, 22, C.violet, 700, 'right', MONO);
  }
  function overlays(t) {
    const by = ((t * 130) % (H + 600)) - 300;
    ctx.drawImage(bandCache, 0, Math.round(by - 142));
    ctx.drawImage(fxCache, 0, 0);
  }

  // ── DRAW — mọi thứ suy từ `t`, KHÔNG state tích lũy (guard chụp giây bất kỳ) ─
  function draw(rawT) {
    const t = Math.min(Math.max(rawT, 0), DURATION - 0.001);
    const idx = Math.max(0, beatAt(t));
    const b = beats[idx];
    ctx.drawImage(bgCache, 0, 0);
    // Beat 0 KHÔNG fade-in (t=0 phải là cover hoàn chỉnh), chỉ fade khi thoát beat.
    const env = idx === 0
      ? (1 - ease(clamp((t - (b.end - 0.25)) / 0.5)))
      : ease(clamp((t - (b.at - 0.3)) / 0.55)) * (1 - ease(clamp((t - (b.end - 0.25)) / 0.5)));
    ctx.save(); ctx.globalAlpha *= env;
    if (idx === 0) scene0(t);
    else if (idx === 1) scene1(t);
    else if (idx === 2) scene2(t);
    else if (idx === 3) scene3(t);
    else if (idx === 4) scene4(t);
    else if (idx === 5) scene5(t);
    else scene6(t);
    ctx.restore();
    drawTitle(t, b, idx, env);
    drawSubs(t);
    drawHud(t);
    overlays(t);
  }

  // ── CONTRACT + LOOP ───────────────────────────────────────────────────────
  window.__clip = { duration: DURATION, width: W, height: H, draw, beats, freeze: false };
  const t0 = performance.now();
  function loop() {
    if (!window.__clip.freeze) draw(((performance.now() - t0) / 1000) % DURATION);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

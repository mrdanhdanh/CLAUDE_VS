<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cha đẻ Elixir: AI viết code — ngôn ngữ cho ai? — storyboard clip 50s</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background:#06070f; color:#eef0ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#06070f; }
  .stage { width:min(100vw, 562.5px); aspect-ratio:9/16; position:relative; overflow:hidden; background:#06070f; }
  canvas { display:block; width:100%; height:100%; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
  <main class="stage" aria-label="Storyboard clip 50 giây: José Valim, cha đẻ Elixir, đặt câu hỏi ngôn ngữ lập trình nên tối ưu cho ai khi AI viết phần lớn code — và ba đề xuất của ông">
    <canvas id="canvas" width="1080" height="1920" role="img" aria-label="Clip 7 phần: câu hỏi của cha đẻ Elixir; nghịch lý cộng đồng; cú pháp và trình biên dịch; ba đề xuất gồm ràng buộc mạnh hơn, truy vấn code như cơ sở dữ liệu, quan sát lúc chạy; và câu hỏi để lại"></canvas>
    <h1 class="sr">Cha đẻ Elixir: AI viết code — ngôn ngữ cho ai?</h1>
  </main>
<script>
(() => {
  const canvas = document.querySelector('#canvas');
  // alpha:false — canvas đục cho rasterizer nhanh hơn (nền luôn được phủ kín mỗi khung).
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = canvas.width;
  const H = canvas.height;

  // ── TOKENS ────────────────────────────────────────────────────────────────
  // Một object DUY NHẤT. Thiếu key ở đây = ctx.fillStyle = undefined = KHÔNG throw,
  // chữ giữ màu cũ ⇒ tàng hình. verify-frames.mjs quét đúng chỗ này.
  const C = {
    bg0: '#06070f', bg1: '#0b0f1f', panel: '#111735', panel2: '#161d42',
    line: '#28315e', ink: '#eef0ff', muted: '#9aa3cf', dim: '#666f99',
    violet: '#b18cff', cyan: '#5fd4ff', green: '#5dfc9b', amber: '#ffc857',
    red: '#ff6b81', pink: '#ff8ad4', blue: '#6f8dff', white: '#ffffff'
  };

  // ── BEATS ─────────────────────────────────────────────────────────────────
  // `at`/`end` phải khớp `segments` trong voiceover-segments.json (guard timing so 2 bên).
  const DURATION = 50;
  const beats = [
    { at: 0,    end: 7,    eyebrow: 'Ý KIẾN · 24.09.2026', title: 'Cha đẻ Elixir hỏi:\nAI viết code —\nngôn ngữ cho ai?', sub: 'Bài gây tranh luận của José Valim: ngôn ngữ nên tối ưu cho AI, không phải cho người viết.', size: 78 },
    { at: 7,    end: 16,   eyebrow: '01 · CỘNG ĐỒNG', title: 'Thư viện rẻ đi —\nnhưng còn ai\nxây chung?', sub: 'Hai mặt trái ngược: agent build rẻ đi, nhưng tự build quá dễ thì khó giữ chuẩn chung.', size: 82 },
    { at: 16,   end: 24.5, eyebrow: '02 · CÚ PHÁP & TRÌNH BIÊN DỊCH', title: 'Cú pháp đẹp —\nAI không quan tâm.\nNó thấy token.', sub: 'Người thấy ?. dễ đọc hơn — AI chỉ thấy mảnh ký hiệu. Và compiler vẫn còn cần.', size: 78 },
    { at: 24.5, end: 32,   eyebrow: '03 · BA ĐỀ XUẤT · 1/3', title: 'Ràng buộc —\nhơn tiện dụng.', sub: 'Bốn lớp bảo đảm thay vì tiện dụng — và đừng giới hạn agent bằng suy luận kiểu.', size: 80 },
    { at: 32,   end: 40,   eyebrow: '03 · BA ĐỀ XUẤT · 2/3', title: 'Code như\ncơ sở dữ liệu.', sub: 'Để agent truy vấn code như cơ sở dữ liệu — thay vì nhảy từng dòng như editor.', size: 80 },
    { at: 40,   end: 45,   eyebrow: '03 · BA ĐỀ XUẤT · 3/3', title: 'Nhìn lúc chạy —\nkhông ngồi debug.', sub: 'Debugger là cho người — agent tự đo trace, tự chẩn đoán lỗi production.', size: 80 },
    { at: 45,   end: 50,   eyebrow: 'CÒN BẠN NGHĨ SAO?', title: 'Ngôn ngữ cho AI —\ncộng đồng cho ai?', sub: 'Nếu agent viết phần lớn code, cái gì giữ cộng đồng lại?', size: 82 }
  ];
  const TONES = [C.violet, C.pink, C.amber, C.violet, C.cyan, C.amber, C.violet];

  // ── SUBTITLE (burned-in) — đúng lời voiceover, đọc được khi tắt tiếng ────
  const SUBS = [
    { at: 0.4,  end: 7,    text: 'Khi AI viết phần lớn code — ngôn ngữ lập trình nên thiết kế cho ai?', hi: ['AI', 'thiết kế cho ai'] },
    { at: 7.4,  end: 11.6, text: 'Hai mặt trái ngược: công nghệ thu hẹp khoảng cách —', hi: ['thu hẹp khoảng cách'] },
    { at: 11.7, end: 16,   text: 'nhưng nếu tự build quá dễ, còn ai cùng xây chung?', hi: ['cùng xây chung'] },
    { at: 16.4, end: 20.4, text: 'Cú pháp đẹp — AI chỉ thấy mảnh ký hiệu.', hi: ['mảnh ký hiệu'] },
    { at: 20.5, end: 24.5, text: 'Và ngôn ngữ vẫn cần: không có ngôn ngữ nào giỏi mọi thứ.', hi: ['giỏi mọi thứ'] },
    { at: 24.9, end: 28.4, text: 'Ràng buộc thay vì tiện dụng: bốn lớp bảo đảm —', hi: ['bốn lớp bảo đảm'] },
    { at: 28.5, end: 32,   text: 'từ thiết kế, kiểm tra tĩnh, chặn lúc chạy, đến test và fuzz.', hi: ['chặn lúc chạy', 'test và fuzz'] },
    { at: 32.4, end: 36.2, text: 'Coi code như cơ sở dữ liệu để agent tự truy vấn —', hi: ['cơ sở dữ liệu', 'tự truy vấn'] },
    { at: 36.3, end: 40,   text: 'thay vì chỉ nhảy từng dòng như editor.', hi: ['từng dòng'] },
    { at: 40.4, end: 45,   text: 'Và nhìn thẳng lúc chạy — agent tự đo, tự chẩn đoán thay vì debug.', hi: ['lúc chạy', 'tự chẩn đoán'] },
    { at: 45.4, end: 50,   text: 'Còn bạn: AI viết code — cộng đồng lập trình giữ được gì?', hi: ['cộng đồng'] }
  ];

  // ── HELPERS ───────────────────────────────────────────────────────────────
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const rv = (t, start, dur) => ease(clamp((t - start) / dur));       // reveal 0..1
  const hexA = (hex, a) => hex + Math.round(clamp(a, 0, 1) * 255).toString(16).padStart(2, '0');
  function beatAt(t) { return beats.findIndex(b => t >= b.at && t < b.end); }
  function hash1(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

  function text(str, x, y, size, color, weight = 600, align = 'left', font = 'Arial') {
    ctx.font = `${weight} ${size}px "${font}", "Segoe UI", sans-serif`;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
  }
  // Đo + ngắt dòng 1 LẦN cho chuỗi tĩnh (cache ở beats/subs) — không measureText mỗi khung.
  function layoutLines(str, maxW, size, weight, font) {
    ctx.font = `${weight} ${size}px "${font}", "Segoe UI", sans-serif`;
    const lines = [];
    for (const part of str.split('\n')) {
      let lineText = '';
      for (const word of part.split(' ')) {
        const test = lineText ? `${lineText} ${word}` : word;
        if (ctx.measureText(test).width > maxW && lineText) { lines.push(lineText); lineText = word; }
        else lineText = test;
      }
      if (lineText) lines.push(lineText);
    }
    return lines;
  }
  function roundRect(x, y, w, h, r, fill, stroke, lw = 0) {
    if (w <= 0 || h <= 0) return;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
  }
  function chip(label, x, y, color) {
    ctx.font = '700 26px Consolas, monospace';
    const w = ctx.measureText(label).width + 44;
    roundRect(x, y, w, 54, 27, C.panel2, hexA(color, 0.67), 2);
    text(label, x + 22, y + 28, 26, color, 700, 'left', 'Consolas');
    return w;
  }
  function tag(label, x, y, color) {
    ctx.font = '700 22px Consolas, monospace';
    const w = ctx.measureText(label).width + 32;
    roundRect(x, y, w, 44, 22, hexA(color, 0.13), color, 2);
    text(label, x + 16, y + 23, 22, color, 700, 'left', 'Consolas');
    return w;
  }
  // Edge chảy: dash trượt + 2 packet — dùng cho mọi mũi tên của clip.
  function flowEdge(x1, y1, x2, y2, t, ph = 0) {
    ctx.save();
    ctx.strokeStyle = C.line; ctx.lineWidth = 3;
    ctx.setLineDash([14, 12]); ctx.lineDashOffset = -t * 70;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]);
    for (let k = 0; k < 2; k++) {
      const f = ((t * 0.55 + ph + k * 0.5) % 1);
      const px = x1 + (x2 - x1) * f, py = y1 + (y2 - y1) * f;
      ctx.globalAlpha *= 0.35; ctx.fillStyle = C.cyan;
      ctx.beginPath(); ctx.arc(px, py, 9, 0, 7); ctx.fill();
      ctx.globalAlpha /= 0.35; ctx.fillStyle = C.white;
      ctx.beginPath(); ctx.arc(px, py, 3.5, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // ── NỀN TĨNH — bake 1 lần (bg + glow + ghost glyphs). Trước đây vẽ lại
  //    gradient + chữ 300px MỖI KHUNG = nguồn lag chính (đo được p95 70ms).
  const bgCache = document.createElement('canvas');
  bgCache.width = W; bgCache.height = H;
  {
    const g = bgCache.getContext('2d');
    g.fillStyle = C.bg0; g.fillRect(0, 0, W, H);
    const rg = g.createRadialGradient(540, 1000, 80, 540, 1000, 1150);
    rg.addColorStop(0, 'rgba(177,140,255,0.06)');
    rg.addColorStop(1, 'rgba(177,140,255,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    g.save(); g.globalAlpha = 0.05; g.fillStyle = C.violet;
    g.font = '800 300px Arial'; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.translate(150, 1720); g.rotate(-0.12); g.fillText('λ', 0, 0); g.restore();
    g.save(); g.globalAlpha = 0.045; g.fillStyle = C.cyan;
    g.font = '800 190px Consolas, monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.translate(880, 250); g.rotate(0.08); g.fillText('{}', 0, 0); g.restore();
  }
  // Vignette cũng bake — trước đây là createRadialGradient toàn màn hình mỗi khung.
  const fxCache = document.createElement('canvas');
  fxCache.width = W; fxCache.height = H;
  {
    const g = fxCache.getContext('2d');
    const vg = g.createRadialGradient(540, 960, 420, 540, 960, 1180);
    vg.addColorStop(0, 'rgba(3,4,10,0)');
    vg.addColorStop(1, 'rgba(3,4,10,0.55)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
  // Dải sáng chạy dọc — bake gradient thành texture, mỗi khung chỉ drawImage.
  const bandCache = document.createElement('canvas');
  bandCache.width = W; bandCache.height = 284;
  {
    const g = bandCache.getContext('2d');
    const bg = g.createLinearGradient(0, 2, 0, 282);
    bg.addColorStop(0, 'rgba(177,140,255,0)');
    bg.addColorStop(0.5, 'rgba(177,140,255,0.045)');
    bg.addColorStop(1, 'rgba(177,140,255,0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, 284);
  }

  // ── SYNTAX RAIN — mỗi cột bake thành strip texture theo "tick" (6Hz),
  //    mỗi khung chỉ còn 36 drawImage thay vì ~500 fillText.
  const RAIN_GLYPHS = 'λfn⇒def<>|>{}[]()=::endletα0x1?';
  const RAIN = Array.from({ length: 36 }, (_, i) => {
    const len = 9 + Math.floor(hash1(i + 80) * 6);
    const strip = document.createElement('canvas');
    strip.width = 36; strip.height = (len - 1) * 26 + 44;
    return { x: 27 + i * 30, sp: 240 + hash1(i) * 380, ph: hash1(i + 40) * 4200, len, strip, g: strip.getContext('2d'), key: -1 };
  });
  function rainGlyph(i, r, tick) {
    return RAIN_GLYPHS[Math.floor(hash1(i * 91.7 + r * 7.7 + tick * 13.3) * RAIN_GLYPHS.length)];
  }
  function drawRain(t) {
    const tick = Math.floor(t * 6);
    for (let i = 0; i < RAIN.length; i++) {
      const col = RAIN[i];
      if (col.key !== tick) {
        col.key = tick;
        const g = col.g;
        g.clearRect(0, 0, col.strip.width, col.strip.height);
        g.font = '400 22px Consolas, monospace';
        g.textAlign = 'left'; g.textBaseline = 'middle';
        for (let r = 0; r < col.len; r++) {
          g.globalAlpha = (1 - r / col.len) * 0.16;
          g.fillStyle = r === 0 ? C.violet : (i % 4 === 0 ? C.cyan : C.muted);
          g.fillText(rainGlyph(i, r, tick), 4, 30 + (col.len - 1 - r) * 26);
        }
      }
      const head = ((t * col.sp + col.ph) % (H + 500)) - 250;
      const top = head - 30 - (col.len - 1) * 26;
      if (top > H + 40 || top + col.strip.height < -40) continue;
      ctx.drawImage(col.strip, col.x, Math.round(top));
    }
  }
  function bgLayers(t) {
    ctx.drawImage(bgCache, 0, 0);
    drawRain(t);
  }

  // ── SCENE 0 · HOOK (0–7) — form "dành cho" morph: NGƯỜI → AI ─────────────
  function sceneHook(t) {
    roundRect(84, 790, 912, 290, 28, C.panel, C.line, 2);
    text('NGÔN NGỮ NÀY DÀNH CHO:', 120, 858, 26, C.muted, 700, 'left', 'Consolas');

    const strike = rv(t, 2.6, 0.5);
    const typed = clamp((t - 3.6) / 0.7);
    const humanA = 1 - rv(t, 3.3, 0.35);
    const agentA = rv(t, 3.5, 0.3);
    ctx.font = '700 46px Consolas, monospace';
    const wHuman = ctx.measureText('LẬP TRÌNH VIÊN').width;

    roundRect(120, 900, 840, 100, 20, C.panel2, strike > 0 && typed < 1 ? hexA(C.red, 0.8) : C.line, 2);
    if (humanA > 0) {
      ctx.save(); ctx.globalAlpha = humanA;
      text('LẬP TRÌNH VIÊN', 156, 950, 46, C.ink, 700, 'left', 'Consolas');
      if (strike > 0) {
        ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(156, 950); ctx.lineTo(156 + wHuman * strike, 950); ctx.stroke();
      }
      ctx.restore();
    }
    if (agentA > 0) {
      const full = 'AI AGENT';
      const n = Math.ceil(full.length * typed);
      ctx.save(); ctx.globalAlpha = agentA;
      text(full.slice(0, n), 156, 950, 46, C.green, 700, 'left', 'Consolas');
      if (n < full.length && (t % 0.6) < 0.4) {
        ctx.font = '700 46px Consolas, monospace';
        const wv = ctx.measureText(full.slice(0, n)).width;
        text('▍', 156 + wv + 8, 950, 46, C.green, 600, 'left', 'Consolas');
      }
      if (typed >= 1) text('✓', 900, 950, 40, C.green, 700, 'left', 'Consolas');
      ctx.restore();
    }
    if (strike > 0 && typed < 1) {
      ctx.save(); ctx.globalAlpha = humanA;
      text('✗', 900, 950, 40, C.red, 700, 'left', 'Consolas');
      ctx.restore();
    }

    const g1 = 1 - rv(t, 3.1, 0.3), g2 = rv(t, 3.8, 0.3);
    if (g1 > 0) { ctx.save(); ctx.globalAlpha = g1; text('người viết code', 156, 1035, 24, C.dim, 500, 'left'); ctx.restore(); }
    if (g2 > 0) { ctx.save(); ctx.globalAlpha = g2; text('agent = AI tự viết code', 156, 1035, 24, C.cyan, 600, 'left'); ctx.restore(); }

    // teaser 3 chủ đề (open loop) — đo width trước để x không lệch
    const TEASERS = [['01 · CỘNG ĐỒNG', C.violet], ['02 · CÚ PHÁP', C.amber], ['03 · CÔNG CỤ', C.cyan]];
    let x = 84;
    TEASERS.forEach(([label, col], i) => {
      ctx.font = '700 26px Consolas, monospace';
      const w = ctx.measureText(label).width + 44;
      const a = rv(t, 4.9 + i * 0.28, 0.4);
      if (a > 0) { ctx.save(); ctx.globalAlpha = a; chip(label, x, 1205, col); ctx.restore(); }
      x += w + 18;
    });
    text('José Valim — cha đẻ Elixir · dashbit.co · 24.09.2026', 540, 1290, 24, C.muted, 500, 'center');
  }

  // ── SCENE 1 · COMMUNITY (7–16) — (A) nhỏ đuổi kịp → (B) phân mảnh ────────
  function sceneCommunity(t) {
    // Phase A — bars: agent giúp ecosystem nhỏ đuổi kịp
    const c1 = rv(t, 7.5, 0.4) * (1 - ease(clamp((t - 11.0) / 0.5)));
    const barA = rv(t, 7.5, 0.4) * (1 - ease(clamp((t - 11.3) / 0.6)));
    if (c1 > 0.01) { ctx.save(); ctx.globalAlpha = c1; text('agent học nhanh — ecosystem nhỏ đuổi kịp', 540, 806, 28, C.cyan, 600, 'center'); ctx.restore(); }
    if (barA > 0.01) {
      ctx.save(); ctx.globalAlpha = barA;
      const rise = ease(clamp((t - 8.2) / 1.8));
      const base = [300, 196, 148, 108, 78, 56];
      const baseY = 1120;
      ctx.strokeStyle = C.line; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(84, baseY); ctx.lineTo(996, baseY); ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const h = base[i] + (300 - base[i]) * (i === 0 ? 1 : rise);
        const x = 96 + i * 152;
        const col = i === 0 ? C.violet : (rise > 0.95 ? C.green : C.muted);
        roundRect(x, baseY - h, 104, h, 12, hexA(col, 0.22), hexA(col, 0.7), 2);
        // label ĐẶT TRONG bar — trước đây trên đỉnh (y 794) đè caption y 806
        text(i === 0 ? 'lớn' : `#${i + 1}`, x + 52, baseY - h + 30, 22, i === 0 ? C.violet : C.ink, 700, 'center', 'Consolas');
      }
      text('kích thước ecosystem', 540, baseY + 34, 22, C.dim, 600, 'center', 'Consolas');
      ctx.restore();
    }

    // Phase B — 1 hub chung → 27 hub riêng
    const c2 = rv(t, 11.9, 0.4);
    if (c2 > 0.01) { ctx.save(); ctx.globalAlpha = c2; text('tự build quá dễ — mỗi người một bản, khó giữ chuẩn chung', 540, 806, 28, C.amber, 600, 'center'); ctx.restore(); }

    const hubA = rv(t, 12.0, 0.4) * (1 - ease(clamp((t - 12.6) / 1.2)));
    if (hubA > 0.01) {
      ctx.save();
      ctx.globalAlpha = hubA * 0.6; ctx.strokeStyle = C.violet; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(540, 1020, 112, 0, 7); ctx.stroke();
      ctx.globalAlpha = hubA; ctx.fillStyle = C.panel;
      ctx.beginPath(); ctx.arc(540, 1020, 108, 0, 7); ctx.fill();
      text('1 THƯ VIỆN', 540, 996, 30, C.ink, 800, 'center', 'Consolas');
      text('CHUNG', 540, 1042, 30, C.violet, 800, 'center', 'Consolas');
      ctx.restore();
    }

    const frag = ease(clamp((t - 12.6) / 1.4));
    const dotsA = rv(t, 11.9, 0.4); // dots chỉ thuộc phase B — trước đây hiện luôn cả phase A
    if (dotsA > 0.01) {
      for (let i = 0; i < 81; i++) {
        const a = i * 2.39996;
        const ring = 140 + (i % 9) * 12;
        const fx = 540 + Math.cos(a + t * 0.25) * ring;
        const fy = 1020 + Math.sin(a + t * 0.25) * ring * 0.9;
        const h = i % 27, hx = 150 + (h % 9) * 98, hy = 930 + Math.floor(h / 9) * 104;
        const slot = Math.floor(i / 27);
        const tx = hx + Math.cos(slot * 2.094 + t * 0.5) * 40;
        const ty = hy + Math.sin(slot * 2.094 + t * 0.5) * 40 * 0.9;
        const x = fx + (tx - fx) * frag, y = fy + (ty - fy) * frag;
        ctx.globalAlpha = (0.35 + 0.5 * hash1(i * 3.3)) * dotsA;
        ctx.fillStyle = frag < 0.5 ? C.cyan : C.pink;
        ctx.fillRect(x - 3, y - 3, 6, 6);
      }
    }
    ctx.globalAlpha = 1;

    if (frag > 0.25) {
      const ha = rv(t, 13.0, 0.5);
      ctx.save();
      for (let h = 0; h < 27; h++) {

  // ── SUBTITLE burned-in — ngắt dòng + gộp run màu cache 1 lần / cửa sổ ───
  function prepSub(s) {
    if (s._lines) return;
    ctx.font = '700 42px "Segoe UI", sans-serif';
    const spaceW = ctx.measureText(' ').width;
    const words = s.text.split(' ');
    const raw = []; let cur = [], curW = 0;
    for (const w of words) {
      const wW = ctx.measureText(w).width;
      const add = cur.length ? spaceW + wW : wW;
      if (cur.length && curW + add > 800) { raw.push(cur); cur = [w]; curW = wW; }
      else { cur.push(w); curW += add; }
    }
    if (cur.length) raw.push(cur);
    const joined = s.text.toLowerCase();
    const mark = new Array(words.length).fill(false);
    for (const ph of s.hi || []) {
      const p = ph.toLowerCase(); let from = 0;
      while (true) {
        const at = joined.indexOf(p, from);
        if (at < 0) break;
        let pos = 0;
        words.forEach((w, wi) => { const st = pos, en = pos + w.length; if (en > at && st < at + p.length) mark[wi] = true; pos = en + 1; });
        from = at + 1;
      }
    }
    let wi = 0;
    s._lines = raw.map((line) => {
      const runs = [];
      for (const w of line) {
        const hi = mark[wi++];
        const last = runs[runs.length - 1];
        if (last && last.hi === hi) last.text += ' ' + w;
        else runs.push({ hi, text: w, w: 0 });
      }
      runs.forEach(r2 => { r2.w = ctx.measureText(r2.text).width; });
      const total = runs.reduce((a, r2) => a + r2.w, 0) + (runs.length - 1) * spaceW;
      return { runs, total };
    });
    s._space = spaceW;
    s._h = s._lines.length * 56 + 40;
    s._top = 1500 - s._h;
  }
  function drawSubs(t) {
    const s = SUBS.find(x => t >= x.at && t < x.end);
    if (!s) return;
    prepSub(s);
    const a = ease(clamp((t - s.at) / 0.25)) * (1 - ease(clamp((t - (s.end - 0.2)) / 0.2)));
    if (a <= 0.01) return;
    const idx = Math.max(0, beatAt(s.at + 0.01));
    ctx.save(); ctx.globalAlpha = a;
    roundRect(84, s._top, 912, s._h, 24, 'rgba(6,7,15,0.86)', C.line, 2);
    ctx.font = '700 42px "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    s._lines.forEach((line, li) => {
      let x = 540 - line.total / 2;
      const y = s._top + 48 + li * 56;
      for (const r2 of line.runs) {
        ctx.fillStyle = r2.hi ? TONES[idx] : C.ink;
        ctx.fillText(r2.text, x, y);
        x += r2.w + s._space;
      }
    });
    ctx.restore();
  }

    const by = ((t * 130) % (H + 600)) - 300;
    ctx.drawImage(bandCache, 0, Math.round(by - 142));
    ctx.drawImage(fxCache, 0, 0);
  }

  // ── DRAW ──────────────────────────────────────────────────────────────────
  // Mọi thứ suy ra từ `t` — KHÔNG state tích lũy (guard chụp khung ở giây bất kỳ phải ra đúng hình).
  function draw(rawT) {
    const t = Math.min(Math.max(rawT, 0), DURATION - 0.001);
    const idx = Math.max(0, beatAt(t));
    const b = beats[idx];
    bgLayers(t);
    // Beat 0 KHÔNG fade-in (frame 1 phải là cover hoàn chỉnh — craft luật #2), chỉ fade khi thoát beat.
    const env = idx === 0
      ? (1 - ease(clamp((t - (b.end - 0.25)) / 0.5)))
      : ease(clamp((t - (b.at - 0.3)) / 0.55)) * (1 - ease(clamp((t - (b.end - 0.25)) / 0.5)));
    ctx.save(); ctx.globalAlpha = env;
    if (idx === 0) sceneHook(t);
    else if (idx === 1) sceneCommunity(t);
    else if (idx === 2) sceneSyntax(t);
    else if (idx === 3) sceneP1(t);
    else if (idx === 4) sceneP2(t);
    else if (idx === 5) sceneP3(t);
    else sceneAsk(t);
    ctx.restore();
    drawTitle(t, b, idx, env);
    drawHud(t);
    overlays(t);
    drawSubs(t);
  }

  window.__clip = { duration: DURATION, width: W, height: H, draw, beats, subs: SUBS, freeze: false };
  let start = performance.now();
  function frame(now) {
    if (!window.__clip.freeze) draw((now - start) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
